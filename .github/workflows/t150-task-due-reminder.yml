# T-150 Phase 2-4: AI起票タスクの期日リマインドを毎朝送る。
# - 毎日 JST 07:00（= UTC 22:00）に schedule で本番へ dry_run=false（実送信）で1回叩く。
#   CAの始業前に届く時刻。既存 auto-expire（JST 03:00）とも被らない。
# - workflow_dispatch で手動実行も可能（dry_run=true なら送信せず対象件数だけ確認できる）。
# - 通知対象は source="AI_ADVISOR" のタスクのみ（手動タスクは対象外）。
#   全タスク対象にすると実測で60件が毎朝飛び、通知が無視される機能になる。
# - 呼び先は本番サービス bizstudio-portal-production を使う
#   （auto-expire は staging URL を叩いているが、新規はこちらに統一する）。
# - INTERNAL_API_KEY は GitHub Secrets 経由（auto-expire / resubmit-stale と同一シークレット）。
# - default branch (master) に置かないと schedule が動かない。
# - ★ schedule が止まっても検知する仕組みは無い（運用メモ: docs/ops_T-150_due_reminder.md）。

name: T-150 task due reminder (daily 07:00 JST)

on:
  schedule:
    # 毎日 JST 07:00 = UTC 22:00
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら送信せず対象件数と内訳のみ（疎通確認用）。定時実行（schedule）は常に false。"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  due-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Determine dry_run flag
        id: flag
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 定時実行は必ず実送信
            echo "dry=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Call due-reminder API (production)
        env:
          API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          set -e
          URL="https://bizstudio-portal-production.up.railway.app/api/internal/tasks/due-reminder?dry_run=${{ steps.flag.outputs.dry }}"
          echo "Calling: $URL"
          echo "Event: ${{ github.event_name }} / dry_run=${{ steps.flag.outputs.dry }}"

          HTTP=$(curl -sS -X POST "$URL" \
            -H "x-api-key: $API_KEY" \
            --max-time 180 \
            -o response.json \
            -w "%{http_code}")

          echo "=== HTTP $HTTP ==="
          echo "=== Response ==="
          cat response.json
          echo ""

          if [ "$HTTP" != "200" ]; then
            echo "::error::due-reminder returned HTTP $HTTP"
            exit 1
          fi

          # サマリを Actions ログにも別途出す（後から遡りやすく）
          if command -v jq >/dev/null 2>&1; then
            echo "=== Summary ==="
            jq -r '"mode=\(.mode) jstToday=\(.jstToday) source=\(.source) total=\(.total) dueToday=\(.dueToday) overdue=\(.overdue) listed=\(.listed) truncated=\(.truncated) sent=\(.sent) duration_ms=\(.durationMs)"' response.json || true
            echo "=== 担当者別内訳 ==="
            jq -r '.byAssignee[]? | "\(.assignee): \(.count)件 (lineworksId=\(.hasLineworksId))"' response.json || true
          fi
